name: Build and Release

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        include:
          - os: macos-latest
            platform: mac
            artifact: Recipe Manager-*.dmg
          - os: ubuntu-latest
            platform: linux
            artifact: Recipe Manager-*.AppImage
          - os: windows-latest
            platform: win
            artifact: Recipe Manager Setup *.exe

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Create icons (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        chmod +x create-icons.sh
        ./create-icons.sh

    - name: Build application
      run: npm run build:electron

    - name: Build for platform
      run: |
        if [ "${{ matrix.platform }}" = "mac" ]; then
          npm run dist:mac
        elif [ "${{ matrix.platform }}" = "linux" ]; then
          npm run dist:linux
        elif [ "${{ matrix.platform }}" = "win" ]; then
          npm run dist:win
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.platform }}-build
        path: |
          dist/*.dmg
          dist/*.AppImage
          dist/*.exe
          dist/*.blockmap
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release Assets
      run: |
        mkdir -p release-assets
        
        # Find and copy the built files
        find artifacts -name "*.dmg" -exec cp {} release-assets/ \;
        find artifacts -name "*.AppImage" -exec cp {} release-assets/ \;
        find artifacts -name "*.exe" -exec cp {} release-assets/ \;
        
        # List what we found
        ls -la release-assets/

    - name: Upload Release Assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./release-assets/
        asset_name: RecipeBox-${{ github.event.release.tag_name }}
        asset_content_type: application/zip
