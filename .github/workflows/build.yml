name: Build and Release

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        include:
          - os: macos-latest
            platform: mac
            artifact: Recipe Manager-*.dmg
          - os: ubuntu-latest
            platform: linux
            artifact: Recipe Manager-*.AppImage
          - os: windows-latest
            platform: win
            artifact: Recipe Manager Setup *.exe

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Clean previous builds (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
        Remove-Item -Recurse -Force node_modules -ErrorAction SilentlyContinue
        Remove-Item -Recurse -Force node_modules\.cache -ErrorAction SilentlyContinue

    - name: Clean previous builds (macOS/Linux)
      if: matrix.os != 'windows-latest'
      run: |
        rm -rf dist/
        rm -rf node_modules/
        rm -rf node_modules/.cache/
        rm -rf ~/.npm/_cacache/

    - name: Install dependencies
      run: npm ci

    - name: Create icons (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        chmod +x create-icons.sh
        ./create-icons.sh

    - name: Build application
      run: npm run build:electron

    - name: Clean before platform build (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        Remove-Item -Recurse -Force dist\mac -ErrorAction SilentlyContinue
        Remove-Item -Recurse -Force dist\win -ErrorAction SilentlyContinue
        Remove-Item -Recurse -Force dist\linux -ErrorAction SilentlyContinue
        Remove-Item -Recurse -Force dist\node_modules -ErrorAction SilentlyContinue
        # Clean the specific target directory that's causing conflicts
        Remove-Item -Recurse -Force dist\mac\Electron.app\Contents\Resources\app\node_modules -ErrorAction SilentlyContinue

    - name: Clean before platform build (macOS/Linux)
      if: matrix.os != 'windows-latest'
      run: |
        rm -rf dist/mac/ 2>/dev/null || true
        rm -rf dist/win/ 2>/dev/null || true
        rm -rf dist/linux/ 2>/dev/null || true
        rm -rf dist/node_modules/ 2>/dev/null || true
        # Clean the specific target directory that's causing conflicts
        rm -rf dist/mac/Electron.app/Contents/Resources/app/node_modules/ 2>/dev/null || true

    - name: Build for platform (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        if ("${{ matrix.platform }}" -eq "win") {
          npm run dist:win
        }

    - name: Build for platform (macOS/Linux)
      if: matrix.os != 'windows-latest'
      run: |
        if [ "${{ matrix.platform }}" = "mac" ]; then
          npm run dist:mac
        elif [ "${{ matrix.platform }}" = "linux" ]; then
          npm run dist:linux
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.platform }}-build
        path: |
          dist/*.dmg
          dist/*.AppImage
          dist/*.exe
          dist/*.blockmap
        retention-days: 30

