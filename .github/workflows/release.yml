name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        include:
          - os: macos-latest
            platform: mac
            artifact: Recipe Manager-*.dmg
          - os: ubuntu-latest
            platform: linux
            artifact: Recipe Manager-*.AppImage
          - os: windows-latest
            platform: win
            artifact: Recipe Manager Setup *.exe

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Create icons (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        chmod +x create-icons.sh
        ./create-icons.sh

    - name: Clean previous builds (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
        Remove-Item -Recurse -Force node_modules\.cache -ErrorAction SilentlyContinue

    - name: Clean previous builds (macOS/Linux)
      if: matrix.os != 'windows-latest'
      run: |
        rm -rf dist/
        rm -rf node_modules/.cache/

    - name: Build application
      run: npm run build:electron

    - name: Build for platform (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        if ("${{ matrix.platform }}" -eq "win") {
          npm run dist:win
        }

    - name: Build for platform (macOS/Linux)
      if: matrix.os != 'windows-latest'
      run: |
        if [ "${{ matrix.platform }}" = "mac" ]; then
          npm run dist:mac
        elif [ "${{ matrix.platform }}" = "linux" ]; then
          npm run dist:linux
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.platform }}-release
        path: |
          dist/*.dmg
          dist/*.AppImage
          dist/*.exe
          dist/*.blockmap
        retention-days: 90

  create-release:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/mac-release/*.dmg
          artifacts/linux-release/*.AppImage
          artifacts/win-release/*.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
