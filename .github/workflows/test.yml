name: Test Workflow

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Test tag trigger
      run: |
        echo "Tag triggered: ${{ github.ref_name }}"
        echo "Event: ${{ github.event_name }}"
        echo "Workflow triggered successfully!"
