name: Continuous Integration

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint code
      run: npm run lint

    - name: Build application
      run: npm run build:electron

  build:
    runs-on: ${{ matrix.os }}
    needs: test
    
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Create icons (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        chmod +x create-icons.sh
        ./create-icons.sh

    - name: Build application
      run: npm run build:electron

    - name: Build for platform
      run: |
        if [ "${{ matrix.platform }}" = "mac" ]; then
          npm run dist:mac
        elif [ "${{ matrix.platform }}" = "linux" ]; then
          npm run dist:linux
        elif [ "${{ matrix.platform }}" = "win" ]; then
          npm run dist:win
        fi

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.platform }}-build-${{ github.sha }}
        path: |
          dist/*.dmg
          dist/*.AppImage
          dist/*.exe
          dist/*.blockmap
        retention-days: 7
